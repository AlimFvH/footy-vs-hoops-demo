<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOOTY vs HOOPS — 3D Character Studio</title>
  <link rel="icon" type="image/png" href="assets/emblem.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070913;
      --card-bg: rgba(15, 23, 42, 0.85);
      --cyan: #00e5ff;
      --gold: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #studio-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }
    #stage {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    canvas#gl {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }

    /* Top Studio Header */
    #studio-header {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .header-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 10px 18px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title-row img {
      width: 32px; height: 32px;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.5));
    }
    .title-text h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title-text p {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    /* Character Tabs */
    .char-tabs {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .tab-btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      color: #ffffff;
    }
    .tab-btn.active.footy {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.25), rgba(15, 23, 42, 0.9));
      border-color: var(--cyan);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
    }
    .tab-btn.active.hoops {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(15, 23, 42, 0.9));
      border-color: var(--gold);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }
    .tab-btn.active.keeper {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(15, 23, 42, 0.9));
      border-color: #10b981;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    /* Bottom Control Bar */
    #studio-controls {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      max-width: 90vw;
    }
    .pill-group {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      overflow-x: auto;
      max-width: 100%;
    }
    .ctrl-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }
    .ctrl-btn.auto-spin.active {
      background: linear-gradient(135deg, #00e5ff, #0099ff);
      color: #040710;
      font-weight: 800;
    }

    /* Hint / Instruction overlay */
    #hint {
      font-size: 11px;
      color: #64748b;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <img id="fvh-official-emblem" src="assets/emblem.png" alt="FOOTY vs HOOPS" style="display:none;" />
  <div id="ui" style="display:none;"></div>

  <div id="studio-wrap">
    <div id="studio-header">
      <div class="header-box">
        <div class="title-row">
          <img src="assets/emblem.png" alt="Emblem" />
          <div class="title-text">
            <h1>3D Character Studio</h1>
            <p>Премиум 3D-модели (Fortnite / Pixar Style)</p>
          </div>
        </div>
      </div>

      <div class="char-tabs">
        <button id="tab-footy" class="tab-btn footy active" onclick="selectChar('footy')">
          ⚽ FOOTY #10
        </button>
        <button id="tab-hoops" class="tab-btn hoops" onclick="selectChar('hoops')">
          🏀 HOOPS #23
        </button>
        <button id="tab-keeper" class="tab-btn keeper" onclick="selectChar('keeper')">
          🧤 KEEPER #1
        </button>
      </div>
    </div>

    <div id="stage">
      <canvas id="gl"></canvas>
    </div>

    <div id="studio-controls">
      <div class="pill-group">
        <button id="btn-spin" class="ctrl-btn auto-spin active" onclick="toggleSpin()">🔄 360° Вращение</button>
        <button id="btn-front" class="ctrl-btn" onclick="setPresetAngle(0)">👤 Спереди</button>
        <button id="btn-threeq" class="ctrl-btn" onclick="setPresetAngle(0.65)">📐 3/4 Ракурс</button>
        <button id="btn-back" class="ctrl-btn" onclick="setPresetAngle(Math.PI)">🔙 Со спины</button>
        <button id="btn-face" class="ctrl-btn" onclick="zoomTarget('face')">🔍 Лицо</button>
        <button id="btn-boots" class="ctrl-btn" onclick="zoomTarget('boots')">👟 Обувь</button>
        <button id="btn-full" class="ctrl-btn" onclick="zoomTarget('full')">🧍 В полный рост</button>
      </div>

      <div class="pill-group">
        <button id="pose-idle" class="ctrl-btn active" onclick="setPose('idle')">🧍 Стойка</button>
        <button id="pose-run" class="ctrl-btn" onclick="setPose('run')">🏃 Бег</button>
        <button id="pose-action" class="ctrl-btn" onclick="setPose('action')">⚡ Экшен</button>
      </div>

      <div id="hint">Зажмите и тяните мышь или пальцы для свободного вращения 360° • Колесико для приближения</div>
    </div>
  </div>

  <script src="js/module-loader.js"></script>
  <script>
    // Prevent full match view from mounting inside 3D Character Studio
    window.__boot = function() {};
  </script>
  <script src="assets/loaders/glb_loader.js?v=studio-2.0"></script>
  <script src="render/hero_characters_3d.js?v=studio-2.0"></script>
  <script src="js/game.js?v=studio-2.0"></script>
  <script src="js/character_studio_app.js?v=studio-2.0"></script>
</body>
</html>
