services:
  - type: web
    name: footy-vs-hoops
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: footy-vs-hoops-db
          property: connectionString

databases:
  - name: footy-vs-hoops-db
    plan: free
    databaseName: footy_vs_hoops
    user: footy_admin

