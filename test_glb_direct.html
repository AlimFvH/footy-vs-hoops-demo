<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GLB Keeper Test</title>
</head>
<body style="margin:0;background:#070913;overflow:hidden;">
<canvas id="gl" style="display:block;width:800px;height:800px;"></canvas>
<img id="emblem-img" src="assets/emblem.png" style="display:none;" />
<script src="js/module-loader.js"></script>
<script>window.__boot = function() {};</script>
<script src="assets/loaders/glb_loader.js"></script>
<script src="js/game.js"></script>
<script>
window.onload = async function() {
  try {
    const G = window.require('gfx/geometry');
    const scene = window.require('gfx/scene');
    const renMod = window.require('gfx/renderer');
    const Renderer = renMod.Renderer;

    const canvas = document.getElementById('gl');
    const renderer = new Renderer(canvas, { antialias: true, preserveDrawingBuffer: true });
    renderer.resize(800, 800, 1.0);

    const s = scene.createScene();
    s.fogAmount = 0;
    s.sunDir = [0.25, 0.85, 0.5];
    s.sunColor = [1.25, 1.20, 1.15];
    s.sky = [0.18, 0.22, 0.34];
    s.ground = [0.08, 0.10, 0.16];

    const cam = new scene.Camera();
    cam.fov = 36;
    cam.aspect = 1.0;
    cam.near = 0.1;
    cam.far = 100;
    cam.position = [0, 1.25, 2.3];
    cam.target = [0, 1.20, 0];
    cam.update();

    // Load Keeper GLB
    const resp = await fetch('assets/characters/keeper1.glb');
    const ab = await resp.arrayBuffer();
    const parsed = window.GLBLoader.parseGLBContainer(ab);

    const gltf = parsed.gltf;
    const bin = parsed.bin;

    function getAccessor(idx) {
      const acc = gltf.accessors[idx];
      const bv = gltf.bufferViews[acc.bufferView];
      const byteOffset = (bv.byteOffset || 0) + (acc.byteOffset || 0);
      if (acc.componentType === 5126) return new Float32Array(bin, byteOffset, acc.count * (acc.type === 'VEC3' ? 3 : acc.type === 'VEC2' ? 2 : 1));
      if (acc.componentType === 5125) return new Uint32Array(bin, byteOffset, acc.count);
      if (acc.componentType === 5123) return new Uint16Array(bin, byteOffset, acc.count);
    }

    const prim = gltf.meshes[0].primitives[0];
    const pos = getAccessor(prim.attributes.POSITION);
    const uvs = getAccessor(prim.attributes.TEXCOORD_0);
    const indices = getAccessor(prim.indices);

    // Compute normals
    const normals = new Float32Array(pos.length);
    for (let i = 0; i < indices.length; i += 3) {
      const i0 = indices[i] * 3, i1 = indices[i+1] * 3, i2 = indices[i+2] * 3;
      const ax = pos[i1] - pos[i0], ay = pos[i1+1] - pos[i0+1], az = pos[i1+2] - pos[i0+2];
      const bx = pos[i2] - pos[i0], by = pos[i2+1] - pos[i0+1], bz = pos[i2+2] - pos[i0+2];
      const nx = ay * bz - az * by;
      const ny = az * bx - ax * bz;
      const nz = ax * by - ay * bx;
      normals[i0] += nx; normals[i0+1] += ny; normals[i0+2] += nz;
      normals[i1] += nx; normals[i1+1] += ny; normals[i1+2] += nz;
      normals[i2] += nx; normals[i2+1] += ny; normals[i2+2] += nz;
    }
    for (let i = 0; i < normals.length; i += 3) {
      const l = Math.hypot(normals[i], normals[i+1], normals[i+2]) || 1;
      normals[i] /= l; normals[i+1] /= l; normals[i+2] /= l;
    }

    // Extract texture
    const imgDef = gltf.images[0];
    const bv = gltf.bufferViews[imgDef.bufferView];
    const imgBytes = new Uint8Array(bin, bv.byteOffset || 0, bv.byteLength);
    const blob = new Blob([imgBytes], { type: imgDef.mimeType || 'image/png' });
    const imgUrl = URL.createObjectURL(blob);
    const img = new Image();
    await new Promise(r => { img.onload = r; img.src = imgUrl; });

    const charRoot = new scene.Node();

    const geo = new G.Geometry(pos, normals, uvs, indices);
    const mat = scene.material({
      texture: new scene.Texture(img),
      spec: 0.40,
      shininess: 42,
      rim: 0.35,
      rimColor: [0.1, 0.9, 0.4],
      doubleSided: true
    });

    const bodyNode = new scene.Node(geo, mat);
    bodyNode.setScale(1.88);
    bodyNode.setPos(0, 0.94, 0);
    charRoot.add(bodyNode);

    // Make Crisp Vector Chest Badge for KEEPER
    function makeChestDecal(charType) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const numberStr = '1';
      const nameStr = 'KEEPER';
      const primaryCol = '#10b981';
      const strokeCol = '#050811';

      ctx.save();
      // Smooth subtle dark lime mask covering messy AI text
      const grad = ctx.createRadialGradient(256, 230, 40, 256, 230, 240);
      grad.addColorStop(0, 'rgba(10, 35, 20, 0.96)');
      grad.addColorStop(0.72, 'rgba(8, 28, 16, 0.88)');
      grad.addColorStop(1, 'rgba(5, 18, 10, 0.0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(256, 230, 245, 220, 0, 0, Math.PI * 2);
      ctx.fill();

      // Official FVH Emblem on upper chest
      const embImg = document.getElementById('emblem-img');
      if (embImg && embImg.complete && embImg.naturalWidth > 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.drawImage(embImg, 256 - 44, 40, 88, 88);
        ctx.restore();
      }

      // Athletic Varsity Wordmark
      ctx.font = '900 66px "Impact", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = primaryCol;
      ctx.strokeStyle = strokeCol;
      ctx.lineWidth = 14;
      ctx.strokeText(nameStr, 256, 172);
      ctx.fillText(nameStr, 256, 172);

      // White inner pinstripe on text
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.strokeText(nameStr, 256, 172);

      // Big Bold Number #1
      ctx.font = '900 176px "Impact", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.lineWidth = 26;
      ctx.strokeStyle = strokeCol;
      ctx.strokeText(numberStr, 256, 316);
      ctx.fillText(numberStr, 256, 316);

      // Neon green inner edge pinstripe on number
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.strokeText(numberStr, 256, 316);

      ctx.restore();
      return c;
    }

    const decalCvs = makeChestDecal('keeper');
    const decalMat = scene.material({
      texture: new scene.Texture(decalCvs),
      transparent: true,
      alpha: 1.0,
      depthWrite: false,
      doubleSided: true
    });
    // Decal placed over the chest
    const decalNode = new scene.Node(G.quad(0.36, 0.36), decalMat);
    decalNode.setPos(0, 1.345, 0.206);
    decalNode.rotation = [-0.07, 0, 0];
    charRoot.add(decalNode);

    s.root.add(charRoot);

    function loop() {
      requestAnimationFrame(loop);
      charRoot.rotation[1] += 0.008;
      renderer.render(s, cam);
    }
    requestAnimationFrame(loop);

    window.__TEST_READY__ = true;
    console.log('✓ Keeper with emblem and raised chest badge rendered!');
  } catch (err) {
    console.error('Test error:', err);
    window.__TEST_ERROR__ = err.message;
  }
};
</script>
</body>
</html>
